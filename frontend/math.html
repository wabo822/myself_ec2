<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>做题助手 · Math Tutor</title>
  <meta name="description" content="基于 Claude 的中学到大学数学解题助手，支持图片识别题目。" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f5f4ed" />
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/vendor/katex/katex.min.css" />

  <style>
    :root {
      --bg: #f5f4ed;
      --surface: #fffdf7;
      --surface-2: #efeee5;
      --ink: #1f1d1a;
      --ink-soft: #4a4742;
      --ink-mute: #7d7a73;
      --accent: #b8470d;
      --accent-soft: #e9d6c5;
      --line: #e3e0d4;
      --user-bg: #1f1d1a;
      --user-fg: #fffdf7;
      --danger: #b00020;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(31, 29, 26, 0.04), 0 8px 24px rgba(31, 29, 26, 0.06);
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      /* 关键：禁掉外层（页面级）滚动条，只让 .messages 滚 */
      overflow: hidden;
    }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--accent); }

    header.topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .brand h1 {
      margin: 0;
      font-family: "DM Serif Display", "Songti SC", serif;
      font-size: 22px;
      letter-spacing: 0.2px;
    }
    .brand .sub {
      color: var(--ink-mute);
      font-size: 13px;
    }
    .top-actions { display: flex; gap: 8px; }
    button.ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink-soft);
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      transition: all .15s ease;
    }
    button.ghost:hover { background: var(--surface); border-color: var(--ink-mute); color: var(--ink); }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      overflow: hidden;
      min-height: 0;          /* flex 子项能正常 shrink，不撑破父级 */
    }
    .chat {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      padding: 0 24px;
      min-height: 0;          /* 让 .messages 能在该容器内独立滚动 */
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0 16px;
      scroll-behavior: smooth;
    }
    .empty {
      text-align: center;
      color: var(--ink-mute);
      padding: 48px 16px;
    }
    .empty h2 {
      font-family: "DM Serif Display", serif;
      color: var(--ink);
      font-size: 28px;
      margin: 0 0 8px;
    }
    .empty p { margin: 4px 0; font-size: 14px; }
    .empty .hints {
      margin-top: 18px;
      display: inline-flex;
      flex-direction: column;
      gap: 6px;
      color: var(--ink-soft);
      font-size: 13px;
      text-align: left;
    }
    .empty kbd {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11.5px;
    }

    .msg { display: flex; flex-direction: column; margin-bottom: 22px; }
    .msg .meta {
      font-size: 12px;
      color: var(--ink-mute);
      margin-bottom: 6px;
      letter-spacing: .3px;
    }
    .msg .bubble {
      padding: 14px 16px;
      border-radius: var(--radius);
      max-width: 100%;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    .msg.user { align-items: flex-end; }
    .msg.user .bubble {
      background: var(--user-bg);
      color: var(--user-fg);
      border-bottom-right-radius: 4px;
      max-width: 80%;
    }
    .msg.assistant .bubble {
      background: var(--surface);
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
    }
    .msg .images {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .msg .images img {
      max-width: 220px;
      max-height: 220px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      object-fit: contain;
    }
    .bubble pre {
      background: var(--surface-2);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 13px;
    }
    .bubble code:not(pre code) {
      background: var(--surface-2);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.9em;
    }
    .bubble p:first-child { margin-top: 0; }
    .bubble p:last-child { margin-bottom: 0; }
    .msg.user .bubble pre, .msg.user .bubble code:not(pre code) {
      background: rgba(255,255,255,.12);
      color: var(--user-fg);
    }
    .typing { display: inline-flex; gap: 4px; align-items: center; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--ink-mute);
      animation: blink 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }

    .errorbar {
      background: #fdecea;
      border: 1px solid #f4c7c2;
      color: var(--danger);
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 14px 0 22px;
      background: var(--bg);
    }
    .composer-inner {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 12px 12px 8px;
      transition: border-color .15s;
    }
    .composer-inner:focus-within { border-color: var(--accent); }
    .attached {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .attached:empty { display: none; }
    .attached .thumb {
      position: relative;
      width: 72px; height: 72px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface-2);
      border: 1px solid var(--line);
    }
    .attached .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .attached .thumb button {
      position: absolute; top: 2px; right: 2px;
      width: 20px; height: 20px;
      border-radius: 50%;
      border: none;
      background: rgba(31,29,26,.75);
      color: #fff;
      font-size: 14px; line-height: 1;
      cursor: pointer;
    }
    textarea#input {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      font: inherit;
      color: var(--ink);
      max-height: 220px;
      min-height: 24px;
      line-height: 1.55;
      padding: 4px 6px;
    }
    .composer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      gap: 8px;
    }
    .left-actions, .right-actions { display: flex; gap: 6px; align-items: center; }
    button.icon {
      width: 36px; height: 36px;
      display: inline-flex;
      align-items: center; justify-content: center;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink-soft);
      cursor: pointer;
      transition: all .15s;
    }
    button.icon:hover { background: var(--surface-2); color: var(--ink); border-color: var(--ink-mute); }
    button.icon svg { width: 18px; height: 18px; }
    button#send {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }
    button#send:hover:not(:disabled) { background: #000; border-color: #000; }
    button#send:disabled { opacity: .3; cursor: not-allowed; }
    .hint-bar { font-size: 11.5px; color: var(--ink-mute); padding: 6px 4px 0; }

    /* KaTeX adjustments inside bubbles */
    .bubble .katex-display { margin: .8em 0; overflow-x: auto; overflow-y: hidden; }

    @media (max-width: 640px) {
      header.topbar { padding: 12px 16px; }
      .brand .sub { display: none; }
      .chat { padding: 0 12px; }
      .msg.user .bubble { max-width: 92%; }
    }

    /* Login overlay */
    .login-overlay {
      position: fixed; inset: 0;
      background: rgba(31, 29, 26, .55);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .login-overlay.hidden { display: none; }
    .login-card {
      background: var(--surface);
      border-radius: 18px;
      padding: 28px 30px 24px;
      width: 100%; max-width: 380px;
      margin: 16px;
      box-shadow: 0 12px 48px rgba(0,0,0,.18);
    }
    .login-card h2 {
      margin: 0 0 4px;
      font-family: "DM Serif Display", serif;
      font-size: 24px;
    }
    .login-card .login-sub {
      color: var(--ink-mute);
      font-size: 13px;
      margin-bottom: 20px;
    }
    .login-field { display: block; margin-bottom: 14px; }
    .login-field label {
      display: block;
      font-size: 12px;
      color: var(--ink-soft);
      margin-bottom: 4px;
      letter-spacing: .3px;
    }
    .login-field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      color: var(--ink);
      font: inherit;
      box-sizing: border-box;
    }
    .login-field input:focus { outline: none; border-color: var(--accent); }
    .login-error {
      color: var(--danger);
      font-size: 13px;
      min-height: 18px;
      margin-bottom: 8px;
    }
    button.primary {
      width: 100%;
      padding: 11px;
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 10px;
      font: inherit; font-weight: 500;
      cursor: pointer;
    }
    button.primary:disabled { opacity: .5; cursor: not-allowed; }
    button.primary:hover:not(:disabled) { background: #000; }
    .user-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      background: var(--surface-2);
      border-radius: 999px;
      font-size: 12px;
      color: var(--ink-soft);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>做题助手</h1>
      <span class="sub">Claude · 数学 / 逻辑 / 多模态</span>
    </div>
    <div class="top-actions">
      <span class="user-pill" id="userpill" style="display:none"></span>
      <button class="ghost" id="newchat" title="清空当前对话和服务器记忆">新对话</button>
      <button class="ghost" id="logout" title="退出登录" style="display:none">退出</button>
    </div>
  </header>

  <div class="login-overlay" id="loginOverlay">
    <div class="login-card">
      <h2>登录</h2>
      <div class="login-sub">登录后才能使用做题助手。</div>
      <form id="loginForm" autocomplete="on">
        <div class="login-field">
          <label for="loginUser">用户名</label>
          <input type="text" id="loginUser" autocomplete="username" required />
        </div>
        <div class="login-field">
          <label for="loginPass">密码</label>
          <input type="password" id="loginPass" autocomplete="current-password" required />
        </div>
        <div class="login-error" id="loginError"></div>
        <button class="primary" type="submit" id="loginBtn">登录</button>
      </form>
    </div>
  </div>

  <main>
    <div class="chat">
      <div class="messages" id="messages">
        <div class="empty" id="empty">
          <h2>把题目交给我</h2>
          <p id="empty-sub">支持文字描述题目，也可以直接拍照 / 截图粘贴上传。</p>
          <div class="hints" id="empty-hints">
            <div data-hint="image">· 直接 <kbd>Ctrl/Cmd</kbd> + <kbd>V</kbd> 粘贴截图到下方输入框</div>
            <div data-hint="image">· 也可以拖拽图片，或点击 <kbd>📎</kbd> 选择文件</div>
            <div>· <kbd>Enter</kbd> 发送，<kbd>Shift</kbd> + <kbd>Enter</kbd> 换行</div>
          </div>
        </div>
      </div>

      <div class="composer">
        <div class="composer-inner" id="dropzone">
          <div class="attached" id="attached"></div>
          <textarea id="input" rows="1" placeholder="输入题目，或粘贴 / 拖拽题目图片..."></textarea>
          <div class="composer-row">
            <div class="left-actions">
              <button class="icon" id="attach" title="上传图片">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                </svg>
              </button>
              <input type="file" id="file" accept="image/*" multiple style="display:none" />
            </div>
            <div class="right-actions">
              <button class="icon" id="send" title="发送 (Enter)" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="19" x2="12" y2="5"></line>
                  <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="hint-bar">回答仅供参考，做题前请先自己尝试。图片会原图发给 Claude 用于识别题目。</div>
      </div>
    </div>
  </main>

  <script src="/assets/vendor/marked/marked.min.js"></script>
  <script src="/assets/vendor/katex/katex.min.js"></script>
  <script src="/assets/vendor/katex/contrib/auto-render.min.js"></script>

  <script>
    const $ = (id) => document.getElementById(id);
    const messagesEl = $("messages");
    const emptyEl = $("empty");
    const inputEl = $("input");
    const sendBtn = $("send");
    const attachBtn = $("attach");
    const fileInput = $("file");
    const attachedEl = $("attached");
    const dropzone = $("dropzone");
    const newchatBtn = $("newchat");
    const logoutBtn = $("logout");
    const loginOverlay = $("loginOverlay");
    const loginForm = $("loginForm");
    const loginUser = $("loginUser");
    const loginPass = $("loginPass");
    const loginError = $("loginError");
    const loginBtn = $("loginBtn");
    const userPill = $("userpill");

    let pendingImages = [];        // [{media_type, data, dataUrl}]
    let busy = false;
    let visionEnabled = true;      // corrected by /api/math-chat/config
    let memoryTurns = 3;           // ditto
    let currentUser = null;

    // ---------------- Auth flow ----------------
    function showLogin(msg) {
      loginOverlay.classList.remove("hidden");
      loginError.textContent = msg || "";
      setTimeout(() => loginUser.focus(), 50);
    }
    function hideLogin() { loginOverlay.classList.add("hidden"); }

    async function checkAuth() {
      try {
        const r = await fetch("/api/auth/me", { credentials: "same-origin" });
        if (r.status === 200) {
          const j = await r.json();
          currentUser = j.username;
          onLoggedIn();
          return true;
        }
      } catch (_) {}
      showLogin("");
      return false;
    }

    function onLoggedIn() {
      userPill.textContent = `@${currentUser}`;
      userPill.style.display = "";
      logoutBtn.style.display = "";
      hideLogin();
      // Load config + memory in parallel
      Promise.all([
        fetch("/api/math-chat/config").then(r => r.json()).catch(() => ({})),
        fetch("/api/math-chat/memory", { credentials: "same-origin" }).then(r => r.json()).catch(() => ({})),
      ]).then(([cfg, mem]) => {
        applyConfig(cfg);
        renderMemoryAsMessages(mem.messages || []);
        memoryTurns = mem.max_turns || cfg.memory_turns || 3;
        const hintBar = document.querySelector(".hint-bar");
        if (hintBar) {
          const visionNote = visionEnabled ? "" : `当前模型 ${cfg.model || ""} 不支持图片输入。`;
          hintBar.textContent = `做题助手会记住最近 ${memoryTurns} 轮对话；点"新对话"清空记忆。${visionNote}`;
        }
      });
      inputEl.focus();
    }

    function applyConfig(cfg) {
      visionEnabled = !!cfg.vision;
      const sub = document.getElementById("empty-sub");
      if (!visionEnabled) {
        attachBtn.style.display = "none";
        inputEl.setAttribute("placeholder", "输入题目（当前模型仅支持文字）...");
        if (sub) sub.textContent = `当前后端模型 ${cfg.model || ""} 不支持图片识别，请用文字描述题目。`;
        document.querySelectorAll('[data-hint="image"]').forEach(el => el.remove());
      }
    }

    function renderMemoryAsMessages(msgs) {
      if (!msgs.length) return;
      if (emptyEl && emptyEl.parentNode) emptyEl.remove();
      msgs.forEach((m) => appendMessage(m.role, m.content));
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = loginUser.value.trim();
      const password = loginPass.value;
      if (!username || !password) return;
      loginBtn.disabled = true;
      loginError.textContent = "";
      try {
        const r = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ username, password }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) {
          loginError.textContent = j.detail || `登录失败 (HTTP ${r.status})`;
          return;
        }
        currentUser = j.username;
        loginPass.value = "";
        onLoggedIn();
      } catch (err) {
        loginError.textContent = "网络错误，请重试。";
      } finally {
        loginBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      if (!confirm("退出登录？记忆会保留在服务器，下次登录可继续。")) return;
      try { await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" }); } catch (_) {}
      currentUser = null;
      messagesEl.innerHTML = "";
      messagesEl.appendChild(emptyEl);
      pendingImages = [];
      renderAttached();
      userPill.style.display = "none";
      logoutBtn.style.display = "none";
      showLogin("");
    });

    const MAX_IMAGE_BYTES = 12 * 1024 * 1024; // raw, before base64 — phone photos up to ~12MB OK
    const ACCEPTED_TYPES = ["image/jpeg", "image/png", "image/gif", "image/webp"];

    function autoresize() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 220) + "px";
    }
    inputEl.addEventListener("input", () => { autoresize(); refreshSendState(); });

    function refreshSendState() {
      const hasText = inputEl.value.trim().length > 0;
      const hasImg = pendingImages.length > 0;
      sendBtn.disabled = busy || (!hasText && !hasImg);
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = reader.result; // data:image/png;base64,XXXX
          const comma = result.indexOf(",");
          resolve({ dataUrl: result, data: result.slice(comma + 1) });
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function handleFiles(files) {
      if (!visionEnabled && files.length) {
        showError("当前后端模型不支持图片输入，请用文字描述题目。");
        return;
      }
      for (const file of files) {
        if (!ACCEPTED_TYPES.includes(file.type)) {
          showError(`不支持的图片格式：${file.type || "未知"}（仅支持 jpg / png / gif / webp）`);
          continue;
        }
        if (file.size > MAX_IMAGE_BYTES) {
          showError(`图片过大：${(file.size / 1024 / 1024).toFixed(1)} MB（上限 5 MB）`);
          continue;
        }
        const { dataUrl, data } = await fileToBase64(file);
        pendingImages.push({ media_type: file.type, data, dataUrl });
      }
      renderAttached();
      refreshSendState();
    }

    function renderAttached() {
      attachedEl.innerHTML = "";
      pendingImages.forEach((img, idx) => {
        const div = document.createElement("div");
        div.className = "thumb";
        div.innerHTML = `<img src="${img.dataUrl}" alt="附件 ${idx + 1}" /><button title="移除">×</button>`;
        div.querySelector("button").onclick = () => {
          pendingImages.splice(idx, 1);
          renderAttached();
          refreshSendState();
        };
        attachedEl.appendChild(div);
      });
    }

    function showError(msg) {
      const bar = document.createElement("div");
      bar.className = "errorbar";
      bar.textContent = msg;
      messagesEl.appendChild(bar);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      setTimeout(() => bar.remove(), 6000);
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }

    // 把所有数学片段先抠出来用占位符替换，避免 marked 把 \[、\(、_、* 等
    // LaTeX 字符当成 markdown 语法吃掉。marked 跑完再把数学片段放回去交给 KaTeX。
    function stashMath(text) {
      const stash = [];
      const place = (m) => `@@KATEX${stash.push(m) - 1}@@`;
      // 顺序：先长后短；多行 $$...$$ / \[...\]，再单行 \(...\) / $...$
      const masked = text
        .replace(/\$\$[\s\S]+?\$\$/g, place)
        .replace(/\\\[[\s\S]+?\\\]/g, place)
        .replace(/\\\([\s\S]+?\\\)/g, place)
        // 单行 $...$：内部不允许跨行或再次出现 $
        .replace(/(^|[^\\$])\$([^\n$]+?)\$(?!\d)/g, (_, pre, inner) => pre + place("$" + inner + "$"));
      return { masked, stash };
    }
    function unstashMath(html, stash) {
      return html.replace(/@@KATEX(\d+)@@/g, (_, i) => stash[parseInt(i, 10)]);
    }

    function renderMarkdown(text) {
      const wrapper = document.createElement("div");
      const { masked, stash } = stashMath(text);

      let html;
      if (typeof marked !== "undefined" && marked && typeof marked.parse === "function") {
        html = marked.parse(masked, { gfm: true, breaks: true });
      } else {
        html = escapeHtml(masked).replace(/\n/g, "<br>");
      }
      html = unstashMath(html, stash);
      wrapper.innerHTML = html;

      if (window.renderMathInElement) {
        renderMathInElement(wrapper, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "\\[", right: "\\]", display: true },
            { left: "$",  right: "$",  display: false },
            { left: "\\(", right: "\\)", display: false },
          ],
          throwOnError: false,
          ignoredTags: ["script","noscript","style","textarea","pre","code"],
        });
      }
      return wrapper.innerHTML;
    }

    function appendMessage(role, content, images = [], { typing = false } = {}) {
      if (emptyEl && emptyEl.parentNode) emptyEl.remove();
      const wrap = document.createElement("div");
      wrap.className = `msg ${role}`;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = role === "user" ? "你" : "做题助手";
      wrap.appendChild(meta);
      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (images.length) {
        const imgs = document.createElement("div");
        imgs.className = "images";
        images.forEach((img) => {
          const el = document.createElement("img");
          el.src = img.dataUrl || `data:${img.media_type};base64,${img.data}`;
          imgs.appendChild(el);
        });
        bubble.appendChild(imgs);
      }

      if (typing) {
        bubble.innerHTML += `<div class="typing"><span></span><span></span><span></span></div>`;
      } else if (content) {
        if (role === "assistant") {
          const md = document.createElement("div");
          md.innerHTML = renderMarkdown(content);
          bubble.appendChild(md);
        } else {
          const p = document.createElement("div");
          p.style.whiteSpace = "pre-wrap";
          p.textContent = content;
          bubble.appendChild(p);
        }
      }

      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return wrap;
    }

    async function send() {
      if (busy) return;
      const text = inputEl.value.trim();
      if (!text && pendingImages.length === 0) return;
      busy = true;
      sendBtn.disabled = true;

      const imagesForApi = pendingImages.map(({ media_type, data }) => ({ media_type, data }));
      const imagesForUi = pendingImages.slice();
      appendMessage("user", text, imagesForUi);

      inputEl.value = "";
      autoresize();
      pendingImages = [];
      renderAttached();

      const typingMsg = appendMessage("assistant", "", [], { typing: true });

      try {
        const res = await fetch("/api/math-chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ question: text, images: imagesForApi }),
        });
        if (res.status === 401) {
          typingMsg.remove();
          showError("会话已过期，请重新登录。");
          showLogin("会话过期，重新登录后即可继续。");
          return;
        }
        if (!res.ok) {
          let detail = `HTTP ${res.status}`;
          if (res.status === 413) {
            detail = "图片太大被网关拒绝（>25MB）。试着压缩一下，或拆开多次发。";
          } else {
            try { const j = await res.json(); if (j.detail) detail = j.detail; } catch (_) {}
          }
          throw new Error(detail);
        }
        const data = await res.json();
        typingMsg.remove();
        appendMessage("assistant", data.answer || "(空回答)");
      } catch (err) {
        typingMsg.remove();
        showError("请求失败：" + (err && err.message ? err.message : err));
      } finally {
        busy = false;
        refreshSendState();
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", send);
    attachBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => {
      handleFiles(Array.from(e.target.files || []));
      fileInput.value = "";
    });

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        send();
      }
    });

    inputEl.addEventListener("paste", (e) => {
      const items = (e.clipboardData || {}).items || [];
      const imgs = [];
      for (const it of items) {
        if (it.kind === "file") {
          const f = it.getAsFile();
          if (f && f.type && f.type.startsWith("image/")) imgs.push(f);
        }
      }
      if (imgs.length) {
        e.preventDefault();
        handleFiles(imgs);
      }
    });

    ["dragenter", "dragover"].forEach((ev) => dropzone.addEventListener(ev, (e) => {
      e.preventDefault(); e.stopPropagation();
      dropzone.style.borderColor = "var(--accent)";
    }));
    ["dragleave", "drop"].forEach((ev) => dropzone.addEventListener(ev, (e) => {
      e.preventDefault(); e.stopPropagation();
      dropzone.style.borderColor = "";
    }));
    dropzone.addEventListener("drop", (e) => {
      const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []).filter(f => f.type.startsWith("image/"));
      if (files.length) handleFiles(files);
    });

    newchatBtn.addEventListener("click", async () => {
      if (busy) return;
      if (!confirm("清空当前对话和服务器记忆？此操作不可恢复。")) return;
      try {
        await fetch("/api/math-chat/memory", { method: "DELETE", credentials: "same-origin" });
      } catch (_) { /* ignore — user can retry */ }
      pendingImages = [];
      renderAttached();
      messagesEl.innerHTML = "";
      messagesEl.appendChild(emptyEl);
      inputEl.value = "";
      autoresize();
      refreshSendState();
    });

    // 启动：先验证身份，已登录就拉记忆/配置；否则弹登录框
    checkAuth();
  </script>
</body>
</html>
